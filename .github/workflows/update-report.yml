name: 每日更新報告

on:
  schedule:
    # GitHub 排程使用 UTC：09:30 UTC = 台灣時間 17:30。
    # 尖峰時段 GitHub 排程可能延遲數分鐘到半小時。
    - cron: "30 9 * * *"
  workflow_dispatch:   # 可在 GitHub 的 Actions 頁面手動執行

permissions:
  contents: write

concurrency:
  group: update-report
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Taipei   # 報告的「更新日」與結束日都以台灣時間計算
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # 證交所歷史除息資料不會變動，快取起來避免每次重抓 20 多年的資料
      - uses: actions/cache@v4
        with:
          path: cache
          key: twse-cache-${{ github.run_id }}
          restore-keys: twse-cache-

      - name: 產生報告
        run: python build_report.py

      - name: 推送更新
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add report.html
          if git diff --cached --quiet; then
            echo "報告沒有變動"
          else
            git commit -m "自動更新報告 $(date +%Y-%m-%d)"
            git push
          fi
